{% extends "registration/auth_base.html" %}
{% block title %}Nouveau mot de passe · Transport Console{% endblock %}

{% block content %}
<div class="auth-card">
  <h2 class="auth-card__title">Nouveau mot de passe</h2>
  <form method="post" class="mt-16" data-loading>
    {% csrf_token %}
    {% for field in form %}
      <div class="form-row">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {{ field.errors }}
      </div>
    {% endfor %}
    <button type="submit" class="btn btn--block mt-16">Enregistrer</button>
  </form>
</div>
{% endblock %}
