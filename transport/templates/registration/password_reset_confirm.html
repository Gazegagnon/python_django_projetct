{% extends "transport/base.html" %}
{% block title %}Nouveau mot de passe · Transport Console{% endblock %}

{% block content %}
<div class="auth-card">
  <h2 class="page-header__title">Nouveau mot de passe</h2>
  <form method="post" data-loading>
    {% csrf_token %}
    {% for field in form %}
      <div class="form-row">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {{ field.errors }}
      </div>
    {% endfor %}
    <div class="actions mt-16">
      <button type="submit" class="btn">Enregistrer</button>
    </div>
  </form>
</div>
{% endblock %}
